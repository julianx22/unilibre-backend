<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Universidad Libre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #C8102E 0%, #8B0000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #C8102E;
            margin-top: 0;
            text-align: center;
            font-size: 28px;
        }
        h2 {
            color: #F2A900;
            text-align: center;
            font-size: 22px;
            margin-bottom: 30px;
        }
        .card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
        }
        .card h3 {
            color: #333;
            margin: 0 0 10px 0;
        }
        button {
            background: #C8102E;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #8B0000;
        }
        #mensaje {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .exito {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ Universidad Libre de Colombia</h1>
        <h2>Sistema de Gestión de Asistencia</h2>
        
        <div class="card">
            <h3>👨‍🎓 Estudiantes</h3>
            <p>Registra tu asistencia con QR</p>
        </div>
        
        <div class="card">
            <h3>👨‍🏫 Profesores</h3>
            <p>Gestiona tus clases</p>
        </div>
        
        <div class="card">
            <h3>👨‍💼 Administradores</h3>
            <p>Control total del sistema</p>
        </div>
        
        <button onclick="probarConexion()">Probar Conexión con el Servidor</button>
        
        <div id="mensaje"></div>
    </div>

    <script>
        async function probarConexion() {
            const mensaje = document.getElementById('mensaje');
            mensaje.style.display = 'block';
            mensaje.className = '';
            mensaje.textContent = 'Probando conexión...';
            
            try {
                const respuesta = await fetch('http://localhost:3001/api/health');
                const datos = await respuesta.json();
                
                mensaje.className = 'exito';
                mensaje.textContent = '✅ ' + datos.message;
            } catch (error) {
                mensaje.className = 'error';
                mensaje.textContent = '❌ No se pudo conectar con el servidor';
            }
        }
    </script>
</body>
</html>
